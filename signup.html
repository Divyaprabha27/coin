<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RetroVerse Arcade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <button class="theme-toggle" aria-label="Toggle Dark Mode">
        <i class="fa-solid fa-moon"></i>
    </button>

    <main>
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="auth-header">
                            <div class="auth-header-logo">
                                <a href="index.html" class="logo"><i class="fa-solid fa-gamepad"></i> RetroVerse</a>
                            </div>
                            <h3>Join the Game</h3>
                        </div>

                        <form class="auth-form"
                            onsubmit="event.preventDefault(); alert('Sign up functionality would be implemented here');">
                            <div class="form-row">
                                <div class="form-group">
                                    <div class="input-wrapper">
                                        <i class="fa-solid fa-user input-icon"></i>
                                        <input type="text" id="Name" class="form-input" placeholder="Enter your  name"
                                            required>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <div class="input-wrapper">
                                        <i class="fa-solid fa-envelope input-icon"></i>
                                        <input type="email" id="email" class="form-input" placeholder="Enter your email"
                                            required>
                                    </div>
                                </div>
                            </div>



                            <div class="form-row">
                                <div class="form-group">
                                    <div class="input-wrapper">
                                        <i class="fa-solid fa-lock input-icon"></i>
                                        <input type="password" id="password" class="form-input"
                                            placeholder="Create a password" required>
                                        <button type="button" class="password-toggle"
                                            onclick="togglePassword('password')">
                                            <i class="fa-solid fa-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <div class="input-wrapper">
                                        <i class="fa-solid fa-lock input-icon"></i>
                                        <input type="password" id="confirmPassword" class="form-input"
                                            placeholder="Confirm your password" required>
                                        <button type="button" class="password-toggle"
                                            onclick="togglePassword('confirmPassword')">
                                            <i class="fa-solid fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="form-options">
                                <label class="checkbox-label">
                                    <input type="checkbox" name="terms" required>
                                    <span class="checkmark"></span>
                                    <span class="label-text">I agree to the <a href="#" class="auth-link">Terms of
                                            Service</a> and <a href="#" class="auth-link">Privacy Policy</a></span>
                                </label>
                            </div>



                            <button type="submit" class="btn auth-btn">Create Account</button>
                        </form>

                        <div class="auth-divider">
                            <span>OR</span>
                        </div>

                        <div class="social-auth">
                            <button class="btn social-btn google-btn">
                                <i class="fa-brands fa-google"></i>
                                Google
                            </button>
                            <button class="btn social-btn facebook-btn">
                                <i class="fa-brands fa-facebook-f"></i>
                                Facebook
                            </button>
                        </div>

                        <div class="auth-footer">
                            <p>Already have an account? <a href="signin.html" class="auth-link">Sign in</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <script src="script.js"></script>
        <script>
            function togglePassword(inputId) {
                const input = document.getElementById(inputId);
                const toggle = input.nextElementSibling;
                const icon = toggle.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            }


        </script>
</body>

</html>
